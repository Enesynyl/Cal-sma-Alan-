<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çalışma Alanım</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a63;--ac:#1d6b57;--ac2:#e3f1ec;--bd:#dedcd4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--sf:#202220;--tx:#eeeee9;--mu:#9a998f;--ac:#4fc3a1;--ac2:#1f3a32;--bd:#35372f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161715;--sf:#202220;--tx:#eeeee9;--mu:#9a998f;--ac:#4fc3a1;--ac2:#1f3a32;--bd:#35372f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:24px;margin:0 0 6px}h3{margin:18px 0 8px;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:8px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin-top:4px}
textarea{min-height:70px}label{display:block;margin:10px 0;font-size:13px;color:var(--mu)}
.wrap{max-width:860px;margin:0 auto;padding:14px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.top select{width:auto;margin:0;font-weight:600}
.nav{display:flex;gap:6px;overflow-x:auto;padding:12px 0}
.nav button{white-space:nowrap;border-radius:99px;padding:7px 13px}
.nav button.on,.tabs button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.it{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;margin:6px 0;cursor:pointer}
.it div{flex:1;min-width:0}.it small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .x{border:0;background:none;padding:4px}
.hd{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:16px 0 4px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:4px 16px 16px;margin-bottom:12px}
.m{color:var(--mu)}.empty{text-align:center;color:var(--mu);padding:30px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}.st b{font-size:24px;display:block}
.wz{max-width:520px;margin:0 auto;padding:30px 16px}
.cd{display:block;width:100%;text-align:left;font-size:17px;padding:16px;margin:10px 0}.cd.on{border-color:var(--ac);background:var(--ac2)}
.chk{display:flex;gap:10px;align-items:center;margin:6px 0;color:var(--tx);font-size:15px}.chk input{width:auto;margin:0}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--sf);color:var(--tx);width:min(440px,92vw);max-height:88vh}
dialog::backdrop{background:#0006}
body{background-size:cover;background-position:center;background-attachment:fixed;transition:background .3s}
h1{font-weight:800;letter-spacing:-.02em}
button{border-radius:14px;transition:transform .15s,background .15s}button:active{transform:scale(.96)}
.it,.card,.st{border-radius:20px;border-color:transparent;box-shadow:0 4px 18px #0000000f}
.it{transition:transform .15s}.it:hover{transform:translateY(-2px)}
.top select{border-radius:99px;padding:9px 16px;background:var(--sf);border-color:transparent;box-shadow:0 4px 14px #0000000f}
.nav button{display:inline-flex;align-items:center;gap:6px;padding:6px 14px 6px 6px;border-color:transparent;box-shadow:0 3px 10px #0000000d}
.ib{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:var(--ibr,50%);background:var(--ibg,var(--ac2));font-size:15px}
.bgon::before{content:'';position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 42%,transparent);z-index:-1;pointer-events:none}
.bgon .it,.bgon .card,.bgon .st,.bgon .cal div,.bgon .top select,.bgon .nav button{background:color-mix(in srgb,var(--sf) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bgon .nav button.on{background:var(--ac2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal i{font-style:normal;text-align:center;font-size:12px;color:var(--mu)}.cal div{background:var(--sf);border:1px solid var(--bd);border-radius:8px;min-height:62px;padding:3px;overflow:hidden;font-size:11px}.cal div.o{opacity:.4}.cal div.td{border-color:var(--ac)}.cal span{display:block;background:var(--ac2);border-radius:4px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- Defter modu ---- */
.nb{position:relative;margin:10px 0 18px;padding-left:24px}
.nb .tape{position:absolute;top:-8px;left:50%;width:96px;height:24px;background:#ffc8dd;opacity:.85;transform:translateX(-50%) rotate(-3deg);z-index:3;border-radius:3px;box-shadow:0 1px 4px #0002}
.nb .spr{position:absolute;left:0;top:16px;bottom:16px;width:28px;z-index:2;background:radial-gradient(circle at 14px 14px,#fff 0 4px,#9a9aa8 4.5px 6.5px,transparent 7px) 0 0/28px 36px repeat-y}
.nb .pg{position:relative;background-color:#fffffe;color:#2b2b3a;border-radius:6px 22px 22px 6px;box-shadow:0 8px 26px #0000001f,inset 0 0 0 1px #0000000a;padding:18px 18px 18px 50px;font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Marker Felt","Comic Sans MS",cursive;font-size:16px;line-height:28px;overflow:hidden}
.nb .pg::before{content:'';position:absolute;left:38px;top:0;bottom:0;width:2px;background:#f4a7a7bb}
.nb.cizgili .pg{background-image:repeating-linear-gradient(transparent 0 27px,#cfe2f3 27px 28px);background-position:0 18px}
.nb.kareli .pg{background-image:linear-gradient(#d9e8f5 1px,transparent 1px),linear-gradient(90deg,#d9e8f5 1px,transparent 1px);background-size:28px 28px;background-position:0 18px}
.nb .pg input,.nb .pg textarea{background:transparent;border:0;border-radius:0;padding:0;margin:0;font:inherit;color:inherit;outline:0;width:100%;box-shadow:none}
.nb .pg ::placeholder{color:#9a9aa8;opacity:.8}
.nb .nti{font-weight:700;font-size:20px;border-bottom:2px dashed #f0c14b!important;margin-bottom:6px!important}
.nb .nta{min-height:112px;resize:vertical;line-height:28px}
.nbh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.nbh b{font-size:20px}.nbh div{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nb button,.nb .ph{font:13px system-ui,sans-serif;padding:6px 12px;border-radius:99px;background:#fff;color:#2b2b3a;border:1px solid #0002;margin:0;display:inline-block;cursor:pointer}
.nb button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.nb .ent{border-top:2px dotted #0002;padding-top:6px;margin-top:12px}
.nb .eh{display:flex;justify-content:space-between;align-items:center;font:12px/20px system-ui,sans-serif;color:#8a8a96}
.nb .eh button{border:0;background:none;padding:2px 5px}
.nb .tp{display:inline-block;font-weight:700;font-size:19px;background:linear-gradient(transparent 55%,#ffe66d 55%);padding:0 5px;cursor:pointer;border-radius:3px;line-height:28px;transition:background .2s}
.nb .tp i{font-style:normal;font-size:14px}
.nb .tp:hover{background:linear-gradient(transparent 15%,#ffd43b 15%)}
.nb .bd2{white-space:pre-wrap;word-break:break-word}
.pols{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 4px}
.pol{position:relative;background:#fff;padding:6px 6px 14px;box-shadow:0 3px 10px #0003;transform:rotate(var(--r,0deg));line-height:0;cursor:pointer}
.pol img{width:104px;height:104px;object-fit:cover;display:block}
.pol .rx{position:absolute;top:-9px;right:-9px;border:0;background:#ff6b8a;color:#fff;width:22px;height:22px;border-radius:50%;padding:0;line-height:22px;font-size:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;z-index:9999;font-size:14px;max-width:90vw}
.ph2{display:inline-block;cursor:pointer;border:1px solid var(--bd);border-radius:14px;padding:8px 14px;margin:6px 0}

.hc .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hc .g4 label{margin:6px 0 0;font-size:12px}.hc .g4 input{padding:8px 6px;text-align:center}
.hc .bdg{display:inline-block;border-radius:99px;padding:3px 11px;font-weight:700;background:var(--ac2);color:var(--ac);white-space:nowrap}
.hc .bdg.k{background:#ffe1e1;color:#b3261e}.hc .hn{font-size:13px;color:var(--mu);margin-top:8px}
.tips p{margin:8px 0;padding:10px 12px;border-radius:14px;background:var(--ac2)}.tips p.w{background:#fff0d6;color:#6b4a00}.tips p.k{background:#ffe1e1;color:#7a1d17}.tips p.g{background:#e3f6e8;color:#1b5e2e}
.pol .fl{line-height:1.3;font:12px system-ui,sans-serif;width:104px;height:104px;display:grid;place-items:center;text-align:center;word-break:break-all;color:#2b2b3a;padding:4px}
.nb .pg select{background:transparent;border:1px dashed #0003;border-radius:10px;padding:4px 8px;margin:4px 0;font:14px system-ui,sans-serif;color:#2b2b3a;width:auto;max-width:100%}
.pols>span{align-self:flex-start}

.wrap{max-width:1100px}
.shell{display:flex;gap:12px;align-items:flex-start}
.main{flex:1;min-width:0;padding-top:12px}
.side{position:sticky;top:0;flex:0 0 56px;width:56px;height:100vh;height:100dvh;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:10px;padding:12px 0 calc(20px + env(safe-area-inset-bottom,0px))}
.side::-webkit-scrollbar{display:none}
.wsb{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;background:var(--sf);border-radius:99px;padding:6px;box-shadow:0 4px 14px #0000000f;justify-content:center}
.wsb .lb{display:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.side .nav{flex-direction:column;overflow:visible;padding:0;gap:6px}
.side .nav button{width:100%;justify-content:center;padding:6px}
.side .nav .lb{display:none}
.side .nav2{margin-top:auto}
.bgon .wsb{background:color-mix(in srgb,var(--sf) 78%,transparent);backdrop-filter:blur(12px)}
@media(min-width:700px){.side{flex-basis:200px;width:200px}.side .nav button{justify-content:flex-start;padding:6px 14px 6px 6px}.side .nav .lb,.wsb .lb{display:inline}.wsb{justify-content:flex-start}}
.side{padding-left:8px;padding-right:8px;flex-basis:72px;width:72px}
@media(min-width:700px){.side{flex-basis:216px;width:216px}}
@media(max-width:520px){.wrap{padding:8px}.hc .g4{grid-template-columns:repeat(2,1fr)}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-top:10px}
.fld{position:relative;background:linear-gradient(145deg,var(--ac2),var(--sf));border:1px solid var(--ac);border-radius:4px 14px 14px 14px;padding:26px 12px 14px;min-height:96px;cursor:pointer;box-shadow:0 6px 14px #0000001a;transition:transform .15s}
.fld:hover{transform:translateY(-3px)}.fld::before{content:"";position:absolute;top:-9px;left:-1px;width:48px;height:10px;background:var(--ac);border-radius:6px 6px 0 0;opacity:.85}
.fld b{display:block;margin-bottom:4px}.fld small{color:var(--mu)}
.dnb{position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:6px 12px 12px 6px;box-shadow:0 8px 18px #00000022;overflow:hidden}
.dspir{height:14px;background:radial-gradient(circle,var(--bg) 4px,transparent 5px) 0 0/22px 14px repeat-x;border-bottom:1px solid var(--bd)}


@keyframes flR{from{transform:perspective(900px) rotateY(55deg);transform-origin:left;opacity:.25}to{transform:none;opacity:1}}
@keyframes flL{from{transform:perspective(900px) rotateY(-55deg);transform-origin:right;opacity:.25}to{transform:none;opacity:1}}
.dtb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.dtb select{width:auto;margin:0}.dtb .ph2{cursor:pointer}
.pgc{position:relative;height:560px;overflow:hidden;color:var(--tx);background-color:var(--sf)}
.pgc.cizgili{background-image:linear-gradient(90deg,transparent 38px,#d9777799 38px,#d9777799 40px,transparent 40px),linear-gradient(transparent 27px,var(--bd) 27px);background-size:100% 100%,100% 28px}
.pgc.kareli{background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:28px 28px}
.pgc.noktali{background-image:radial-gradient(var(--mu) 1.3px,transparent 1.7px);background-size:28px 28px;background-position:14px 14px}
.pgc.sari{background-color:#fff6b8;color:#2b2b2b;background-image:linear-gradient(transparent 27px,#d8cc7a 27px);background-size:100% 28px}
.pgc.koyu{background-color:#1f2433;color:#eee;background-image:linear-gradient(transparent 27px,#ffffff22 27px);background-size:100% 28px}
.pgc .dti{display:block;width:100%;height:56px;margin:0;border:0;background:transparent;border-radius:0;font:700 20px Georgia,serif;padding:0 14px 0 50px;color:inherit;position:relative;z-index:1}
.pgc textarea{display:block;margin:0;width:100%;height:504px;border:0;border-radius:0;background:transparent;color:inherit;padding:0 14px 0 50px;resize:none;font:16px/28px Georgia,'Segoe Print',serif;position:relative;z-index:1}
.pgc.kareli textarea,.pgc.noktali textarea,.pgc.duz textarea,.pgc.koyu textarea,.pgc.kareli .dti,.pgc.noktali .dti,.pgc.duz .dti,.pgc.koyu .dti{padding-left:14px}
#dfo{position:absolute;inset:0;pointer-events:none;z-index:2}.ob.sel{outline:2px dashed var(--ac)}.ob{position:absolute;pointer-events:auto;cursor:grab;touch-action:none;user-select:none;transform-origin:center;line-height:1}.ob img{width:100%;height:100%;display:block;pointer-events:none}
.hnd{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;background:#fff;border:2px solid var(--ac);border-radius:50%;touch-action:none;z-index:5;cursor:pointer}
.hnd.n,.hnd.s,.hnd.e,.hnd.w{border-radius:5px}.hnd.rot{margin-top:-34px;background:var(--ac)}.hnd.skx{margin-top:-20px;border-radius:3px;background:#ffd24d}.hnd.sky{margin-left:-20px;border-radius:3px;background:#ffd24d}

#dfc{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}#dfc.on{pointer-events:auto;touch-action:none;cursor:crosshair}
.pgc.flR{animation:flR .45s ease}.pgc.flL{animation:flL .45s ease}
@keyframes up{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dlgIn{from{opacity:0;translate:0 18px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
@keyframes pop{0%{scale:.6;opacity:0}70%{scale:1.1}100%{scale:1;opacity:1}}
@keyframes wob{25%{rotate:-14deg}75%{rotate:10deg}}
@keyframes toastA{0%{opacity:0;translate:0 14px}8%{opacity:1;translate:0 0}88%{opacity:1}100%{opacity:0}}
.main.vin{animation:fadeIn .3s ease}
.vin :is(.it,.card,.st,.fld,.hd){animation:up .42s cubic-bezier(.2,.8,.2,1) both}
.vin :is(.it,.card,.st,.fld):nth-child(n+2){animation-delay:.05s}.vin :is(.it,.card,.st,.fld):nth-child(n+4){animation-delay:.1s}.vin :is(.it,.card,.st,.fld):nth-child(n+7){animation-delay:.15s}.vin :is(.it,.card,.st,.fld):nth-child(n+10){animation-delay:.2s}
button,.it,.card,.st,.fld{transition:translate .15s,scale .15s,transform .15s,box-shadow .2s,background-color .2s,border-color .2s}
button:not(:disabled):active{scale:.95}
@media(hover:hover){button:not(:disabled):hover{translate:0 -1px}.it:hover{translate:0 -2px;box-shadow:0 6px 14px #0000001a}.side .nav button:hover{scale:1.04}.nav .ib{display:inline-block}.nav button:hover .ib{animation:wob .45s}}
dialog[open]{animation:dlgIn .28s cubic-bezier(.2,.8,.2,1)}dialog::backdrop{animation:fadeIn .25s}
.toast{animation:toastA 3.2s both}
.hnd{animation:pop .2s}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}

/* ---- Bugün sayfası ---- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;margin:0 0 14px;background:linear-gradient(135deg,var(--ac2),color-mix(in srgb,var(--sf) 82%,var(--ac) 18%));box-shadow:0 6px 24px #0000000f}
.hero h1{margin:0;font-size:26px;line-height:1.2;padding-right:110px}
.hero p{margin:6px 0 0}.hero .sum{font-size:15px;color:var(--tx);margin-top:10px;font-weight:600}
.hero .hb{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.hero .big{position:absolute;right:-8px;bottom:-24px;font-size:100px;opacity:.12;pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:22px}}
.tile{cursor:pointer;background:var(--sf);border-radius:20px;padding:14px;box-shadow:0 4px 18px #0000000f;border-left:5px solid var(--c,var(--ac))}
.tile b{display:block;font-size:28px;line-height:1.1;margin-top:2px}.tile small{color:var(--mu)}.tile i{font-style:normal;float:right;font-size:22px}
.tile.z{opacity:.65}
.sec{background:var(--sf);border-radius:22px;padding:6px 14px 10px;margin:0 0 14px;box-shadow:0 4px 18px #0000000f}
.bgon .tile,.bgon .sec{background:color-mix(in srgb,var(--sf) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sh{display:flex;align-items:center;gap:10px;padding:10px 2px 4px}
.sh i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ac2);font-size:16px}
.sh b{flex:1;font-size:15px}
.cnt{background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.sec.late .sh i,.sec.late .cnt{background:#fde8e8;color:#c92a2a}
.sec .it{box-shadow:none;border:0;border-radius:14px;background:color-mix(in srgb,var(--ac2) 45%,transparent);backdrop-filter:none}
.sec.late .it{background:#fde8e833}
.vin :is(.hero,.tile,.sec){animation:up .42s cubic-bezier(.2,.8,.2,1) both}
.vin .tile:nth-child(2){animation-delay:.05s}.vin .tile:nth-child(3){animation-delay:.1s}.vin .tile:nth-child(4){animation-delay:.15s}
.utb.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}

<script>

/* ---- IndexedDB ---- */
const openDB=()=>new Promise((a,b)=>{const r=indexedDB.open('calisma-alani',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('ws',{keyPath:'id'});d.createObjectStore('rec',{keyPath:'id'}).createIndex('ws','ws');d.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});

/* ---- Tanımlar ---- */

function uniWebGo(i){UN.web.cur=i>=0&&W.uni.links&&W.uni.links[i]?W.uni.links[i].l:'';uniWeb()}
function uniWebOpen(){window.open(UN.web.cur||uniUrl(W.uni),'_blank','noopener')}
function uniLinkAdd(){const n=prompt('Bağlantı adı (örn. Duyurular):');if(!n)return;let l=prompt('Sayfa adresi (örn. '+W.uni.d+'/duyurular):');if(!l)return;l=l.trim();if(!/^https?:\/\//i.test(l))l='https://'+l;upd({uni:{...W.uni,links:[...(W.uni.links||[]),{n:n.trim(),l}]}})}
function uniLinkDel(i){if(!confirm('Bu bağlantı silinsin mi?'))return;UN.web.cur='';upd({uni:{...W.uni,links:(W.uni.links||[]).filter((x,j)=>j!==i)}})}
function uniWeb(){const b=$('un');if(!b||!W.uni)return;const u=W.uni,ls=u.links||[];
 if(UN.web.d!==u.d){UN.web.d=u.d;UN.web.cur=''}
 const cur=UN.web.cur||uniUrl(u);
 b.innerHTML=`<div class="row" style="justify-content:flex-start;flex-wrap:wrap;gap:6px;margin-bottom:8px"><button onclick="uniWebGo(-1)">🏠 Ana sayfa</button>${ls.map((l,i)=>`<span style="display:inline-flex;gap:2px"><button onclick="uniWebGo(${i})">${e(l.n)}</button><button onclick="uniLinkDel(${i})" title="Sil">✕</button></span>`).join('')}<button onclick="uniLinkAdd()">➕ Bağlantı</button><button onclick="uniWebOpen()">↗️ Tarayıcıda aç</button></div>
 <div style="position:relative"><iframe id="uwi" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" style="width:100%;height:68vh;border:1px solid rgba(128,128,128,.35);border-radius:12px;background:#fff"></iframe><div id="uwm" style="display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;border-radius:12px;background:rgba(0,0,0,.78);color:#fff"><b>Site yüklenemedi</b><small>Bağlantı yavaş olabilir ya da bu site uygulama içinde açılmaya izin vermiyor.</small><button onclick="uniWebOpen()">↗️ Tarayıcıda aç</button></div></div>
 <p class="m"><small>Sayfa boş ya da hatalı görünüyorsa site uygulama içinde açılmaya izin vermiyordur; “Tarayıcıda aç” ile normal şekilde açabilirsin.</small></p>`;
 const f=$('uwi'),m=$('uwm');let ok=0;f.onload=()=>{ok=1;m.style.display='none'};f.src=cur;
 setTimeout(()=>{if(!ok&&$('uwm'))$('uwm').style.display='flex'},8000)}
async function uniList(force){const b=$('un');if(!b)return;if(UN.mode==='web'){uniWeb();return}b.innerHTML='<div class="empty">Yükleniyor…</div>';
 try{const v=await uniNews(W.uni,UN.mode,force);UN.l=v;b.innerHTML=v.length?v.map(uniRow).join(''):'<div class="empty">Sonuç bulunamadı.'+(UN.mode==='site'?'<br><small>Bu sitenin duyuruları otomatik okunamadı. “Haberler” sekmesini dene ya da adresi düzelt.</small>':'')+'</div>'}
 catch(x){b.innerHTML='<div class="empty">Alınamadı.<br><small>İnternet erişimi yok ya da aracı servisler yanıt vermedi. '+e(x.message||'')+'</small></div>'}}
const uniCalCache={};function uniCalText(doc){const root=doc.querySelector('main,article,[role=main],[class*=content],[id*=content]')||doc.body;root.querySelectorAll('script,style,nav,header,footer,aside,form,iframe,noscript,svg,button').forEach(n=>n.remove());const title=(root.querySelector('h1,h2')?.textContent||doc.title||'Akademik Takvim').replace(/\s+/g,' ').trim(),tables=[...root.querySelectorAll('table')].map(t=>{const rows=[...t.querySelectorAll('tr')].map(r=>[...r.querySelectorAll('th,td')].map(c=>c.innerText.replace(/\s+/g,' ').trim()).filter(Boolean)).filter(r=>r.length);return rows.length?'<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;margin:12px 0">'+rows.map((r,i)=>'<tr>'+r.map(c=>i===0?'<th style="text-align:left;padding:9px;border:1px solid var(--bd)">'+e(c)+'</th>':'<td style="padding:9px;border:1px solid var(--bd)">'+e(c)+'</td>').join('')+'</tr>').join('')+'</table></div>':''}).join(''),text=[...root.querySelectorAll('h2,h3,h4,p,li')].map(n=>({h:/^H/.test(n.tagName),t:n.innerText.replace(/\s+/g,' ').trim()})).filter(x=>x.t.length>3).slice(0,100).map(x=>x.h?'<h4>'+e(x.t)+'</h4>':'<p>'+e(x.t)+'</p>').join('');return '<h3>'+e(title)+'</h3>'+(tables||text||'<p>Takvim sayfası bulundu, ancak içeriği okunamadı.</p>')}async function uniCalLoad(y){const b=$('ucbody');if(!b||!W.uni)return;const key=W.uni.d+'|'+y;if(uniCalCache[key]){b.innerHTML=uniCalCache[key];return}b.innerHTML='<div class="empty">Üniversitenin resmî akademik takvimi aranıyor…</div>';const domain=W.uni.d.replace(/^www\./,''),base=uniUrl(W.uni),kw=/akademik|academic|takvim|calendar/i,exact=/akademik.{0,24}takvim|takvim.{0,24}akademik|academic.{0,24}calendar|calendar.{0,24}academic/i;let queue=[],seen=new Set(),found='';const links=(doc,u)=>[...doc.querySelectorAll('a[href]')].map(a=>{try{return{t:(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim(),u:new URL(a.getAttribute('href'),u).href}}catch(e){return null}}).filter(x=>{try{const h=new URL(x.u).hostname;return x&&(h===domain||h.endsWith('.'+domain))}catch(e){return false}});try{try{const q=encodeURIComponent('site:'+domain+' akademik takvim '+y+'-'+(y+1)),items=rssItems(await pxGet('https://www.bing.com/search?q='+q+'&format=rss&setlang=tr'),1);for(const r of items){try{const u=new URL(r.l).href,h=new URL(u).hostname;if(h!==domain&&!h.endsWith('.'+domain))continue;if(/\.pdf(?:[?#]|$)/i.test(u)){found='<h3>'+e(r.t||'Akademik Takvim')+'</h3><iframe title="Resmî akademik takvim" src="'+e(u)+'" style="width:100%;height:75vh;border:1px solid var(--bd);border-radius:12px;background:white"></iframe>';break}queue.push({u,t:r.t,d:0})}catch(e){}}}catch(e){}if(!found)queue.push({u:base,t:'',d:0});while(queue.length&&seen.size<18&&!found){queue.sort((a,b)=>Number(exact.test(b.t+' '+b.u))-Number(exact.test(a.t+' '+a.u)));const x=queue.shift();if(seen.has(x.u))continue;seen.add(x.u);try{const doc=new DOMParser().parseFromString(await pxGet(x.u),'text/html'),ls=links(doc,x.u),pdf=ls.filter(a=>/\.pdf(?:[?#]|$)/i.test(a.u)&&kw.test(a.t+' '+a.u)).sort((a,b)=>Number((b.t+b.u).includes(y+'-'+(y+1)))-Number((a.t+a.u).includes(y+'-'+(y+1))));if(pdf.length){found='<h3>'+e(pdf[0].t||'Akademik Takvim')+'</h3><iframe title="Resmî akademik takvim" src="'+e(pdf[0].u)+'" style="width:100%;height:75vh;border:1px solid var(--bd);border-radius:12px;background:white"></iframe>';break}const text=(doc.body?.innerText||'').replace(/\s+/g,' ');if(exact.test(doc.title+' '+x.t+' '+x.u+' '+text.slice(0,4000))&&(doc.querySelector('table')||/\d{1,2}[./ -]\d{1,2}/.test(text))){found='<p class="m"><small>Resmî kaynak: '+e(new URL(x.u).hostname)+'</small></p>'+uniCalText(doc);break}if(x.d<2)for(const a of ls.filter(a=>kw.test(a.t+' '+a.u)||/öğrenci|ogrenci|student|oidb/i.test(a.t+' '+a.u)).sort((a,b)=>Number(exact.test(b.t+' '+b.u))-Number(exact.test(a.t+' '+a.u))).slice(0,8))if(!seen.has(a.u)&&!queue.some(q=>q.u===a.u))queue.push({u:a.u,t:a.t,d:x.d+1})}catch(e){}}if(!found)throw new Error('Takvim resmî sayfada bulunamadı.');uniCalCache[key]=found;if($('ucbody'))$('ucbody').innerHTML=found}catch(err){if($('ucbody'))$('ucbody').innerHTML='<div class="empty">Bu üniversitenin takvimi alınamadı.<br><small>Resmî site araması veya bağlantı servisi yanıt vermedi. Biraz sonra yeniden deneyebilirsin.</small></div>'}}async function uniPage(){
 if(!W.uni){setTimeout(()=>{UN.q='';},0);return `<h1>Üniversiteni seç</h1><p class="m">Türkiye’deki üniversiteler listede. Üniversite seçince akademik takvim burada görüntülenir.</p><input placeholder="🔍 Üniversite ara…" oninput="uniFilt(this.value)" style="margin:6px 0 10px"><div id="ul">${uniOpts()}</div><div class="row" style="justify-content:flex-start"><button onclick="uniCustom()">➕ Listede yok, kendim ekleyeyim</button></div>`}
 const u=W.uni;setTimeout(()=>UN.mode==='web'?uniWeb():uniCal(),30);
 return `<div class="hero"><span class="big">🏛️</span><h1 style="font-size:22px">${e(uniFull(u))}</h1><p class="m">${e(u.d)}</p></div>
 <div class="bar"><div class="row" style="gap:6px"><button class="utb${UN.mode==='cal'?' on':''}" data-m="cal" onclick="uniTab('cal')">📅 Akademik Takvim</button><button class="utb${UN.mode==='web'?' on':''}" data-m="web" onclick="uniTab('web')">🌐 Web sitesi</button></div></div><div id="un"></div>
 <div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-top:14px"><button onclick="upd({uni:null})">Üniversiteyi değiştir</button><button onclick="uniFix()">✏️ Adresi düzelt</button></div><p class="m"><small>Akademik takvim seçtiğin üniversitenin resmî sitesinden alınıp burada görüntülenir. “Web sitesi” sekmesinden üniversitenin sitesini açabilirsin.</small></p>`}
