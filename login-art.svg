<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8d5d5"/><stop offset=".48" stop-color="#e9d5bd"/><stop offset="1" stop-color="#c6a2a0"/></linearGradient>
 <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a43b52"/><stop offset="1" stop-color="#64243e"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3cf83"/><stop offset="1" stop-color="#d88d55"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3c9a7"/><stop offset="1" stop-color="#c9826e"/></linearGradient>
 <filter id="texture"><feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
</defs>
<rect width="1600" height="1100" fill="url(#bg)"/>
<!-- loose, painterly color shapes; important objects stay inside the tablet-safe frame -->
<g filter="url(#texture)" opacity=".96">
 <path d="M0 0h430l-80 260L0 360Z" fill="url(#wine)"/>
 <path d="M0 360 350 260l120 260-100 250L0 820Z" fill="#df945c"/>
 <path d="M0 820 370 760l150 340H0Z" fill="#7a2d47"/>
 <path d="M430 0h270l-90 270-230-10Z" fill="#efc37d"/>
 <path d="M1600 0h-380l70 270 310 100Z" fill="#7b2944"/>
 <path d="m1600 370-310-100-120 300 130 260 300 0Z" fill="#dc9863"/>
 <path d="M1600 830 1300 830l-140 270h440Z" fill="url(#wine)"/>
 <path d="M930 0h250l-90 260H850Z" fill="#f1d9bd" opacity=".75"/>
</g>
<!-- left: glowing abstract lamp / sun -->
<g transform="translate(230 395) rotate(-10)" filter="url(#texture)">
 <path d="M0-185 145-110 172 45 65 175-105 130-180-10-105-150Z" fill="url(#gold)" stroke="#754747" stroke-width="17" stroke-linejoin="round"/>
 <path d="M-74-46 12-106 95-28 12 60-70 24Z" fill="#a83b50" stroke="#f5dfbd" stroke-width="9"/>
 <circle cx="12" cy="-20" r="25" fill="#493432"/>
 <path d="M-215-210q-60-60-15-100M-180-240q-10-75 55-100M190-160q75-35 115 15" fill="none" stroke="#fff0d4" stroke-width="15" stroke-linecap="round" opacity=".75"/>
 <path d="M-260 5l-55-20m65 70-60 15m420-20 58 12" stroke="#f6e2c5" stroke-width="12" stroke-linecap="round" opacity=".8"/>
</g>
<!-- right: complete abstract human portrait, with breathing room around the silhouette -->
<g transform="translate(1120 205) rotate(3)" filter="url(#texture)">
 <path d="M195 18C75-35-65 50-76 190c-10 123 62 205 157 235l-12 100 110 60 93-95c116-35 177-133 150-255C399 111 300 34 195 18Z" fill="url(#skin)" stroke="#70434a" stroke-width="19" stroke-linejoin="round"/>
 <path d="M-18 116Q88 30 220 82" fill="none" stroke="#f6d6b4" stroke-width="27" stroke-linecap="round" opacity=".8"/>
 <path d="M24 175 143 118 235 147 126 202Z" fill="#3c3034"/>
 <path d="M124 293 248 311 154 368" fill="none" stroke="#8b3c50" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M-28 220 22 254 10 324" fill="none" stroke="#d98f7c" stroke-width="19" stroke-linecap="round"/>
 <path d="M-40 410q120 55 245-10" fill="none" stroke="#f5d4b8" stroke-width="16" stroke-linecap="round" opacity=".6"/>
</g>
<!-- bottom: full open book, not hidden beyond the viewport -->
<g transform="translate(520 825) rotate(-2)" filter="url(#texture)">
 <path d="M0 35Q135-30 275 28v190Q138 150 0 240Z" fill="#f7e7cb" stroke="#71494a" stroke-width="15" stroke-linejoin="round"/>
 <path d="M275 28Q420-35 560 35v205Q420 150 275 218Z" fill="#e5c4a5" stroke="#71494a" stroke-width="15" stroke-linejoin="round"/>
 <path d="M35 85q105-48 205-10M35 130q105-48 205-10M35 175q105-48 205-10M315 85q105-48 205-10M315 130q105-48 205-10M315 175q105-48 205-10" fill="none" stroke="#bd8d79" stroke-width="7" stroke-linecap="round" opacity=".7"/>
 <path d="M275 28v190" stroke="#9a6c63" stroke-width="9"/>
</g>
<!-- warm little desk lamp glow at lower left -->
<g transform="translate(180 855)" filter="url(#texture)">
 <path d="M0 95 45-15 165-15 205 95Z" fill="#efbd70" stroke="#74464a" stroke-width="14" stroke-linejoin="round"/>
 <path d="M105 95v125m-55 0h110" fill="none" stroke="#74464a" stroke-width="16" stroke-linecap="round"/>
 <path d="M42 8h120" stroke="#fff0ce" stroke-width="10" stroke-linecap="round" opacity=".75"/>
</g>
<!-- soft brush marks and tiny glints -->
<g fill="none" stroke-linecap="round" opacity=".55">
 <path d="M500 175q100-45 180 0M760 90q80 30 150-5M1330 700q90 30 160-10M60 700q100-50 175-8" stroke="#fff0d8" stroke-width="22"/>
 <path d="M960 760q90-30 160 12M430 720q70-40 130-5" stroke="#8f4654" stroke-width="13" opacity=".45"/>
</g>
<g fill="#fff1d8" opacity=".85"><circle cx="475" cy="125" r="9"/><circle cx="1020" cy="140" r="7"/><circle cx="1450" cy="770" r="10"/><path d="m1400 205 10 24 24 10-24 10-10 24-10-24-24-10 24-10z"/></g>
<rect width="1600" height="1100" fill="#f0d7bd" opacity=".08" filter="url(#grain)"/>
</svg>