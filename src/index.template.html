<body data-auth-required="1"><script>try{if(localStorage.getItem("fbHas")==="1")document.body.dataset.authRequired="0"}catch(e){}</script>
<div id="startup-loader" role="status" aria-label="Yükleniyor"><span class="startup-spinner"></span></div><script>window.appLocalReady=false;window.appCloudReady=false;window.appLocalReadyDone=()=>{window.appLocalReady=true;if(window.loginViewRequested)window.renderLoggedOutLogin?.();window.tryFinishStartup?.()};window.appCloudReadyDone=()=>{window.appCloudReady=true;window.tryFinishStartup?.()};window.tryFinishStartup=()=>{if(window.appLocalReady&&window.appCloudReady)document.getElementById("startup-loader")?.classList.add("done")};setTimeout(()=>{if(!window.appCloudReady){console.warn("Bulut bağlantısı gecikti; yerel uygulama ile devam ediliyor.");window.appCloudReadyDone?.()}if(!window.appLocalReady){const l=document.getElementById("startup-loader");if(l){l.classList.add("startup-error");l.setAttribute("role","alert");l.setAttribute("aria-label","Uygulama başlatılamadı");l.innerHTML='<div class="startup-error-card"><span class="startup-error-mark">!</span><h1>Uygulama başlatılamadı</h1><p>Yerel veritabanı başlatılamadı. Kayıtların silinmedi. Başlangıç aşaması: '+(window.__startupStage||"henüz başlamadı")+' . Diğer sekmeleri kapatıp yeniden deneyebilirsin.</p><button type="button" onclick="location.reload()">Yeniden dene</button></div>'}}},15000);</script><div class="wrap" id="app"></div>
<dialog id="dl"></dialog>
<script src="/native-spotify.js"></script>
<script>window.addEventListener("error",function(ev){if(ev&&ev.message){window.__startupStage="JavaScript hatası: "+ev.message;if(ev.filename)window.__startupStage+=" ("+ev.filename.split("/").pop()+":"+ev.lineno+")";console.error("Uygulama JavaScript hatası:",ev.message,ev.filename,ev.lineno)}});window.addEventListener("unhandledrejection",function(ev){window.__startupStage="Yakalanmamış işlem hatası: "+String(ev.reason?.message||ev.reason||"bilinmeyen hata");console.error("Uygulama işlem hatası:",ev.reason)});</script><script src="/app.js" onerror="window.__startupStage='app.js dosyası yüklenemedi (404 veya dağıtım çıktısı eksik)';console.error(window.__startupStage)"></script>
</body>
